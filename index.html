<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LogiStrip">

    <title>LogiStrip v3.1</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --border-focus: #4f46e5;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #ffffff;
            --secondary-hover: #f8fafc;
            --success: #10b981;
            --success-bg: #f0fdf4;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 25px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
            --focus-ring: rgba(79, 70, 229, 0.15);
        }

        [data-theme="dark"] {
            --bg-body: #0f172a; 
            --bg-card: #1e293b; 
            --bg-input: #0f172a; 
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
            --border-light: #334155; 
            --border-focus: #6366f1; 
            --primary: #6366f1; 
            --primary-hover: #818cf8; 
            --secondary: #1e293b; 
            --secondary-hover: #334155; 
            --success: #10b981; 
            --success-bg: rgba(16, 185, 129, 0.1);
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-lg: 0 10px 25px -3px rgb(0 0 0 / 0.3), 0 4px 6px -4px rgb(0 0 0 / 0.3);
            --focus-ring: rgba(99, 102, 241, 0.25);
        }

        /* Muted, subtle logo glow for dark mode */
        [data-theme="dark"] .header-logo {
            filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.6)) 
                    drop-shadow(0 0 4px rgba(255, 255, 255, 0.2)) 
                    brightness(1.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 36px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-light);
        }

        /* --- Header --- */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-light);
        }

        .header-logo {
            max-width: 280px;
            height: auto;
            display: block;
            transition: filter 0.3s ease;
        }

        .board-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--primary);
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: none;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea, #formattedOutput {
            width: 100%;
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        textarea {
            font-family: 'JetBrains Mono', monospace;
            height: 120px;
            resize: vertical;
        }

        textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px var(--focus-ring);
            background: var(--bg-card);
        }

        #formattedOutput {
            min-height: 220px;
            font-family: 'JetBrains Mono', monospace;
            white-space: pre-wrap;
            background: var(--bg-card);
            border-left: 4px solid var(--primary);
            color: var(--text-main);
            font-size: 14px;
        }

        #formattedOutput.empty {
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 1px solid var(--border-light);
            background: var(--bg-input);
        }

        /* --- Buttons --- */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 28px;
        }

        .btn-clear, .btn-copy {
            min-width: 180px; 
            padding: 22px 24px; 
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:active {
            transform: scale(0.97) !important;
        }

        .btn-clear {
            background: var(--secondary);
            color: var(--text-main);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }

        .btn-clear:hover {
            background: var(--secondary-hover);
        }
        
        .btn-clear.success {
            color: var(--success);
            border-color: var(--success);
            background: var(--success-bg); 
        }

        .btn-copy {
            background: var(--primary);
            color: white;
            border: 1px solid transparent;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-copy:hover {
            background: var(--primary-hover);
        }

        .btn-copy.success {
            background: var(--success);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn-icon {
            width: 20px;
            height: 20px;
        }

        /* --- Footer --- */
        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--border-light);
        }

        .version-badge {
            background: var(--bg-input);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
        }

        .shortcut-hint {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            background: var(--bg-input);
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            box-shadow: var(--shadow-sm);
        }

        .theme-toggle {
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            cursor: pointer;
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            color: var(--text-main);
            border-color: var(--border-focus);
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="logo.png" alt="Conti Trans LogiStrip" class="header-logo">
        </div>

        <div class="input-group">
            <div class="label-row">
                <label for="rawInput">Raw Load Data Paste</label>
                <span id="boardTag" class="board-tag">Detected</span>
            </div>
            <textarea id="rawInput" autofocus placeholder="Paste raw load board data (Sylectus, ArcBest, etc.)..."></textarea>
        </div>

        <div class="input-group">
            <label>Clean Driver Payload</label>
            <div id="formattedOutput" class="empty">Awaiting load board data...</div>
        </div>

        <div class="btn-group">
            <button class="btn-clear" id="pasteBtn" onclick="pasteFromClipboard()">
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                Paste
            </button>
            
            <button class="btn-copy" id="copyBtn" onclick="copyAndClear()">
                <svg class="btn-icon copy-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                Copy & Clear
            </button>
        </div>

        <div class="footer">
            <span class="version-badge">v3.1</span>
            
            <span class="shortcut-hint">Cmd/Ctrl + Enter to Copy</span>
            
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle Dark Mode" title="Toggle Theme">
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                <svg id="sunIcon" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const moonIcon = document.getElementById('moonIcon');
        const sunIcon = document.getElementById('sunIcon');

        const savedTheme = localStorage.getItem('logistrip_theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            moonIcon.style.display = 'none';
            sunIcon.style.display = 'block';
        }

        themeToggleBtn.addEventListener('click', () => {
            let currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('logistrip_theme', 'light');
                moonIcon.style.display = 'block';
                sunIcon.style.display = 'none';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('logistrip_theme', 'dark');
                moonIcon.style.display = 'none';
                sunIcon.style.display = 'block';
            }
        });

        const inputArea = document.getElementById('rawInput');
        const outputArea = document.getElementById('formattedOutput');
        const copyBtn = document.getElementById('copyBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const boardTag = document.getElementById('boardTag');

        inputArea.addEventListener('input', processData);

        // Global Keyboard Shortcut (Cmd/Ctrl + Enter => Copy & Clear)
        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                e.preventDefault();
                copyAndClear();
            }
        });

        function formatDate(dateStr) {
            if (!dateStr) return "TBD";
            let s = dateStr.trim();
            s = s.replace(/(\d{2})-(\d{2})-(\d{4})/, '$1/$2');
            s = s.replace(/(\d{2})\/(\d{2})\/(\d{4})/, '$1/$2');
            s = s.replace(/\s+/, ' @ ');
            return s;
        }

        function processData() {
            const rawText = inputArea.value.trim();
            if (rawText === "") {
                outputArea.innerText = "Awaiting load board data...";
                outputArea.classList.add('empty');
                boardTag.style.display = 'none';
                return;
            }

            outputArea.classList.remove('empty');

            // Detect Source
            if (rawText.includes("Shipment Units") || rawText.includes("Commodity:") || rawText.includes("Shipment Requirements")) {
                boardTag.innerText = "ArcBest";
                boardTag.style.display = 'inline-block';
                parseArcBest(rawText);
            } else {
                boardTag.innerText = "Sylectus";
                boardTag.style.display = 'inline-block';
                parseSylectus(rawText);
            }
        }

        // --- ArcBest Parser ---
        function parseArcBest(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l !== "");

            const zipLocPattern = /^[A-Za-z\s\.\-']+\s*,\s*[A-Z]{2}\s*\d{5}$/;
            let zipLocs = lines.filter(l => zipLocPattern.test(l));

            let origin = zipLocs[0] || "Origin Not Found";
            let destination = zipLocs[1] || "Destination Not Found";

            const dateTimePattern = /\d{2}-\d{2}-\d{4}\s+\d{2}:\d{2}(?:\s*\([A-Z]+\))?/;
            let dateMatches = text.match(new RegExp(dateTimePattern, 'g')) || [];

            let puTime = dateMatches[0] ? formatDate(dateMatches[0]) : "TBD";
            let delTime = dateMatches[1] ? formatDate(dateMatches[1]) : "TBD";

            let pieces = "1";
            let unitsMatch = text.match(/Shipment Units\s*\n\s*([^\n]+)/i) || text.match(/(\d+\s*(?:Pallets|Plts|Pcs|Skids|Boxes))/i);
            if (unitsMatch) pieces = unitsMatch[1].trim();

            let weight = "0";
            let wtMatch = text.match(/([\d,]+)\s*Pounds/i) || text.match(/Weight\s*:\s*([\d,]+)/i);
            if (wtMatch) weight = wtMatch[1].trim();

            let miles = "0";
            let milesMatch = text.match(/([\d,]+)\s+Shipment Requirements/i);
            let explicitMilesMatch = text.match(/Miles[\t:]\s*([\d,]+)/i);
            
            if (milesMatch) {
                miles = milesMatch[1];
            } else if (explicitMilesMatch) {
                miles = explicitMilesMatch[1];
            }

            let dims = null;
            let dimsMatch = text.match(/(\d+in\.\s*x\s*\d+in\.\s*x\s*\d+in\.)/i) || text.match(/(\d+\s*x\s*\d+\s*x\s*\d+)/i);
            if (dimsMatch) dims = dimsMatch[1].trim();

            let commodity = null;
            let comMatch = text.match(/Commodity:\s*([^\n]+)/i);
            if (comMatch) commodity = comMatch[1].trim();

            const payload = [
                `[PICKUP]`,
                `${origin}`,
                `Ready: ${puTime}`,
                ``,
                `[DELIVERY]`,
                `${destination}`,
                `Drop: ${delTime}`,
                ``,
                `[CARGO]`,
                `Miles: ${miles}`,
                `Pieces: ${pieces}`,
                `Weight: ${weight} lbs`
            ];

            if (dims) payload.push(`Dims: ${dims}`);
            if (commodity) payload.push(`Commodity: ${commodity}`);

            outputArea.innerText = payload.join('\n').trim();
        }

        // --- Sylectus Parser ---
        function parseSylectus(rawText) {
            let tokens = [];
            rawText.split('\n').forEach(line => {
                let parts = line.split('\t').map(p => p.trim()).filter(p => p !== "");
                tokens.push(...parts);
            });

            const locPattern = /^[A-Z\s\.\-']+,\s*[A-Z]{2}\s*\d{5}$/i;
            const isTime = (t) => /^\d{1,2}\/\d{1,2}\/\d{4}\s+\d{1,2}:\d{2}$/.test(t) || /^(ASAP|DIRECT|TBD)$/i.test(t);

            let origin = "Origin Not Found";
            let destination = "Destination Not Found";
            let puTime = "TBD";
            let delTime = "TBD";

            let locIndices = [];
            tokens.forEach((token, idx) => {
                if (locPattern.test(token)) {
                    locIndices.push(idx);
                }
            });

            if (locIndices.length >= 1) {
                origin = tokens[locIndices[0]];
                if (locIndices[0] + 1 < tokens.length && isTime(tokens[locIndices[0] + 1])) {
                    puTime = formatDate(tokens[locIndices[0] + 1]);
                }
            }

            if (locIndices.length >= 2) {
                destination = tokens[locIndices[1]];
                if (locIndices[1] + 1 < tokens.length && isTime(tokens[locIndices[1] + 1])) {
                    delTime = formatDate(tokens[locIndices[1] + 1]);
                }
            }

            const numbers = tokens.filter(t => /^\d+$/.test(t));
            let miles = "0", pieces = "0", weight = "0";

            if (numbers.length >= 3) {
                miles = numbers[numbers.length - 3];
                pieces = numbers[numbers.length - 2];
                weight = numbers[numbers.length - 1];
            } else if (numbers.length === 2) {
                pieces = numbers[0];
                weight = numbers[1];
            }

            const payload = [
                `[PICKUP]`,
                `${origin}`,
                `Ready: ${puTime}`,
                ``,
                `[DELIVERY]`,
                `${destination}`,
                `Drop: ${delTime}`,
                ``,
                `[CARGO]`,
                `Miles: ${miles}`,
                `Pieces: ${pieces} pc`,
                `Weight: ${weight} lbs`
            ];

            outputArea.innerText = payload.join('\n').trim();
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (!text) return;
                
                inputArea.value = text;
                processData();

                const originalHtml = pasteBtn.innerHTML;
                pasteBtn.innerHTML = `
                    <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                    Pasted!
                `;
                pasteBtn.classList.add('success');
                
                setTimeout(() => { 
                    pasteBtn.innerHTML = originalHtml;
                    pasteBtn.classList.remove('success');
                }, 1200);
            } catch (err) {
                console.error('Failed to read clipboard contents: ', err);
                alert("Clipboard access denied.");
            }
        }

        function copyAndClear() {
            const text = outputArea.innerText;
            if (text === "Awaiting load board data...") return;
            
            navigator.clipboard.writeText(text).then(() => {
                const originalHtml = copyBtn.innerHTML;
                
                copyBtn.innerHTML = `
                    <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                    Copied & Cleared!
                `;
                copyBtn.classList.add('success');
                
                inputArea.value = '';
                outputArea.innerText = 'Awaiting load board data...';
                outputArea.classList.add('empty');
                boardTag.style.display = 'none';
                inputArea.focus();
                
                setTimeout(() => { 
                    copyBtn.innerHTML = originalHtml;
                    copyBtn.classList.remove('success');
                }, 1500);
            });
        }
    </script>
</body>
</html>
