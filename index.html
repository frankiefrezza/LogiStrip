<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LogiStrip">

    <title>LogiStrip v2.6</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --border-focus: #4f46e5;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #ffffff;
            --secondary-hover: #f8fafc;
            --success: #10b981;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 25px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
            --focus-ring: rgba(79, 70, 229, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-light);
        }

        /* --- Header --- */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-light);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }

        .logo-icon svg {
            width: 24px;
            height: 24px;
            color: white;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        .version-badge {
            margin-left: 12px;
            background: var(--bg-body);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
        }

        /* --- Form Elements --- */
        .input-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea, #formattedOutput {
            width: 100%;
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: 16px;
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        textarea {
            font-family: 'JetBrains Mono', monospace;
            height: 120px;
            resize: vertical;
        }

        textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px var(--focus-ring);
            background: var(--bg-card);
        }

        textarea::placeholder {
            color: #94a3b8;
            font-family: 'Inter', sans-serif;
        }

        #formattedOutput {
            min-height: 200px;
            font-family: 'JetBrains Mono', monospace;
            white-space: pre-wrap;
            background: var(--bg-card);
            border-left: 4px solid var(--primary);
            color: var(--text-main);
        }

        #formattedOutput.empty {
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 1px solid var(--border-light);
            background: var(--bg-input);
        }

        /* --- Buttons --- */
        .btn-group {
            display: flex;
            gap: 16px;
            margin-top: 32px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            /* Added smooth transition for the transform/scale effect */
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* The physical pressing effect for all buttons */
        button:active {
            transform: scale(0.96) !important;
        }

        .btn-clear {
            background: var(--secondary);
            color: var(--text-main);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }

        .btn-clear:hover {
            background: var(--secondary-hover);
            border-color: #cbd5e1;
        }
        
        .btn-clear.success {
            color: var(--success);
            border-color: var(--success);
            background: #f0fdf4; /* Light green background */
        }

        .btn-copy {
            background: var(--primary);
            color: white;
            border: 1px solid transparent;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }

        .btn-copy:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-copy.success {
            background: var(--success);
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
        }

        /* Button Icons */
        .btn-icon {
            width: 18px;
            height: 18px;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .container {
                padding: 24px;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header">
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <h1>LogiStrip</h1>
            <span class="version-badge">v2.6</span>
        </div>

        <div class="input-group">
            <label for="rawInput">Data Uplink</label>
            <textarea id="rawInput" autofocus placeholder="Paste raw Sylectus data here..."></textarea>
        </div>

        <div class="input-group">
            <label>Decrypted Output</label>
            <div id="formattedOutput" class="empty">Awaiting data injection...</div>
        </div>

        <div class="btn-group">
            <button class="btn-clear" id="clearBtn" onclick="clearAll()">
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                Clear Data
            </button>
            
            <button class="btn-copy" id="copyBtn" onclick="copyToClipboard()">
                <svg class="btn-icon copy-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                Copy to Clipboard
            </button>
        </div>

    </div>

    <script>
        const inputArea = document.getElementById('rawInput');
        const outputArea = document.getElementById('formattedOutput');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');

        inputArea.addEventListener('input', processData);

        function processData() {
            const rawText = inputArea.value.trim();
            if (rawText === "") {
                outputArea.innerText = "Awaiting data injection...";
                outputArea.classList.add('empty');
                return;
            }

            outputArea.classList.remove('empty');

            let lines = [];
            rawText.split('\n').forEach(line => {
                let parts = line.split(/\t|\s{4,}/).map(p => p.trim()).filter(p => p !== "");
                lines.push(...parts);
            });

            const locPattern = /[A-Z\s\.]+,\s[A-Z]{2}\s\d{5}/;
            let origin = "Origin Not Found", puTime = "TBD", destination = "Destination Not Found", delTime = "TBD";
            let miles = "0", pieces = "0", weight = "0";

            if (locPattern.test(lines[0])) origin = lines[0];

            let destIdx = -1;
            for (let i = 1; i < lines.length; i++) {
                if (locPattern.test(lines[i])) {
                    destination = lines[i];
                    destIdx = i;
                    break;
                }
            }

            if (destIdx > 1) puTime = lines.slice(1, destIdx).join(' ');

            const allNumbers = lines.filter(l => /^\d+$/.test(l));
            if (allNumbers.length >= 3) {
                weight = allNumbers[allNumbers.length - 1];
                pieces = allNumbers[allNumbers.length - 2];
                miles = allNumbers[allNumbers.length - 3];
            }

            if (destIdx !== -1) {
                const afterDest = lines.slice(destIdx + 1);
                const datePattern = /\d{2}\/\d{2}\/\d{4}\s\d{2}:\d{2}/;
                for (let part of afterDest) {
                    if (datePattern.test(part)) { delTime = part; break; }
                    if (part.toUpperCase().includes("DIRECT")) { delTime = "Deliver Direct"; break; }
                }
            }

            outputArea.innerText = `${origin}\n${puTime}\n\n${destination}\n${delTime}\n\nMILES: ${miles}\nPC/S: ${pieces}\nWT/LBS: ${weight}`.trim();
        }

        function clearAll() {
            // Clear the logic
            inputArea.value = '';
            outputArea.innerText = 'Awaiting data injection...';
            outputArea.classList.add('empty');
            inputArea.focus();

            // Provide visual feedback for clearing
            const originalHtml = clearBtn.innerHTML;
            clearBtn.innerHTML = `
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
                Cleared!
            `;
            clearBtn.classList.add('success');
            
            // Revert back after 1.5 seconds
            setTimeout(() => { 
                clearBtn.innerHTML = originalHtml;
                clearBtn.classList.remove('success');
            }, 1500);
        }

        function copyToClipboard() {
            const text = outputArea.innerText;
            if (text === "Awaiting data injection...") return;
            
            navigator.clipboard.writeText(text).then(() => {
                const originalHtml = copyBtn.innerHTML;
                
                // Change button to success state
                copyBtn.innerHTML = `
                    <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                    Copied!
                `;
                copyBtn.classList.add('success');
                
                // Revert after 2 seconds
                setTimeout(() => { 
                    copyBtn.innerHTML = originalHtml;
                    copyBtn.classList.remove('success');
                }, 2000);
            });
        }
    </script>
</body>
</html>
